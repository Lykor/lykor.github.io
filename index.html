<!DOCTYPE html>

<head>
    <title>Lykor - web developer</title>
    <style>
        body {
            background: #000;
        }

        .aurora {
            background: #000;
            position: relative;
        }

        .aurora:before,
        .aurora:after {
            content: '';
            display: block;
            position: absolute;
            width: 1px;
            height: 1px;
            border-radius: 100%;
            opacity: 0.18;
        }

        .aurora:before {
            box-shadow: 0 0 30px 30px red;
            animation: hue1 5s linear infinite, move1 10s linear infinite;
        }

        .aurora:after {
            box-shadow: 0 0 30px 30px cyan;
            animation: hue2 10s linear infinite, move2 20s linear infinite;
        }

        @keyframes hue1 {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        @keyframes hue2 {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        @keyframes move1 {
            0% {
                top: 0;
                left: 50%;
            }

            25% {
                left: 0;
            }

            50% {
                top: 100%;
            }

            75% {
                left: 100%;
            }

            100% {
                top: 0;
                left: 50%;
            }
        }

        @keyframes move2 {
            0% {
                top: 50%;
                left: 100%;
            }

            25% {
                top: 100%;
            }

            50% {
                left: 0;
            }

            75% {
                top: 0;
            }

            100% {
                top: 50%;
                left: 100%;
            }
        }

        .contrainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #b6b6b6;
            width: 100%;
            text-align: center;
            font-family: 'Trebuchet MS', Helvetica, sans-serif;
            letter-spacing: 0.7em;
            font-weight: normal;
            text-transform: uppercase;
            text-shadow: 1px 1px 5px 3px #ff0;
            font-size: 5em;
        }

        .small {
            display: flex;
            justify-content: center;
            text-transform: none;
            font-family: 'Trebuchet MS', Helvetica, sans-serif;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1em;
            letter-spacing: 0.3em;
            line-height: 0.5em;
        }
    </style>
</head>

<body>
    <div class="aurora">
        <div id="contrainer">
            <h1>Lykor</h1>
            <div class="small">web-developer</div>
        </div>
</body>

</html>
